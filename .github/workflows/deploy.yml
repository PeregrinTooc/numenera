name: Build, Test and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job widens this for itself only.
permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Pull requests from forks share the "pages" concurrency group with main
    # otherwise, so key on the ref instead and let deploys serialise separately.
    concurrency:
      group: build-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Check translation coverage
        run: npm run check:i18n

      - name: Check Cucumber step definitions
        run: npm run check:steps

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright Browsers
        if: hashFiles('tests/e2e/**/*.ts') != ''
        run: npx playwright install --with-deps

      # Also produces ./dist, which the deploy job publishes.
      - name: Build and run E2E tests
        run: npm run test:e2e:prod

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  # The desktop profile runs inside build-test; the other Rule 9 profiles run
  # here, one job each. Selected by the DEVICE env var (tests/e2e/support/device.ts).
  e2e-devices:
    name: E2E (${{ matrix.device }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: e2e-${{ matrix.device }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        device: [pixel5, iphone12, ipadpro]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # All browsers: iphone12 and ipadpro need WebKit, pixel5 needs Chromium.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build and run E2E tests on ${{ matrix.device }}
        run: npm run test:e2e:prod
        env:
          DEVICE: ${{ matrix.device }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [build-test, e2e-devices]
    runs-on: ubuntu-24.04
    # Only ever publish the default branch. Pull requests run the full test
    # suite above but must never reach production.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
