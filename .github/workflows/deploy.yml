name: Build, Test and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job widens this for itself only.
permissions:
  contents: read

jobs:
  # Fingerprints the commit (scripts/change-inputs.js) and looks up whether
  # those inputs already passed every job, and whether that app is already
  # deployed: a push of documentation alone, or a revert, then runs nothing.
  # The cache entries are only markers. A manual run always verifies and deploys.
  changes:
    name: Find what changed
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      inputs: ${{ steps.fingerprint.outputs.inputs }}
      app: ${{ steps.fingerprint.outputs.app }}
      verify: ${{ github.event_name == 'workflow_dispatch' || steps.verified.outputs.cache-hit != 'true' }}
      deploy: >-
        ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        && (github.event_name == 'workflow_dispatch' || steps.deployed.outputs.cache-hit != 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fingerprint the inputs
        id: fingerprint
        run: |
          echo "inputs=$(node scripts/change-inputs.js fingerprint)" >> "$GITHUB_OUTPUT"
          echo "app=$(node scripts/change-inputs.js fingerprint --app)" >> "$GITHUB_OUTPUT"

      - name: Look up a green run of these inputs
        id: verified
        uses: actions/cache/restore@v6
        with:
          path: .ci-marker
          key: verified-${{ steps.fingerprint.outputs.inputs }}
          lookup-only: true

      - name: Look up a deployment of this app
        id: deployed
        uses: actions/cache/restore@v6
        with:
          path: .ci-marker
          key: deployed-${{ steps.fingerprint.outputs.app }}
          lookup-only: true

  # Also runs, checks and all, when only a deployment is missing: the checks
  # are cheap next to the E2E jobs, which that case skips.
  build-test:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.verify == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Pull requests from forks share the "pages" concurrency group with main
    # otherwise, so key on the ref instead and let deploys serialise separately.
    concurrency:
      group: build-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Run format check
        run: npm run format:check

      - name: Check translation coverage
        run: npm run check:i18n

      - name: Check Cucumber step definitions
        run: npm run check:steps

      - name: Run unit tests
        run: npm run test:unit

      # Produces ./dist, which the deploy job publishes. The E2E jobs build their own.
      - name: Build
        run: npm run build

      - name: Setup Pages
        if: needs.changes.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: needs.changes.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  # Every Rule 9 profile, each split into shards that run on their own runner
  # with one Cucumber worker (E2E_SHARD, scripts/e2e.js). Wall time is the
  # slowest shard: the WebKit profiles take about three times as long.
  e2e:
    name: E2E (${{ matrix.device }}, ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: e2e-${{ matrix.device }}-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, pixel5, iphone12, ipadpro]
        shard: [1, 2, 3, 4]
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      # Only the device's browser engine and its system packages: every other
      # browser only adds downloads, which a slow package mirror turns into
      # half an hour. device.ts says which engine a profile runs on.
      - name: Find the device's browser engine
        id: engine
        run: >-
          node --input-type=module -e 'import { resolveDevice } from "./tests/e2e/support/device.ts";
          console.log("name=" + resolveDevice(process.env.DEVICE).engine)' >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.engine.outputs.name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ steps.engine.outputs.name }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ steps.engine.outputs.name }}
        run: npx playwright install --with-deps ${{ steps.engine.outputs.name }}

      - name: Build and run E2E tests on ${{ matrix.device }}, shard ${{ matrix.shard }}/4
        run: npm run test:e2e:prod
        env:
          E2E_SHARD: ${{ matrix.shard }}/4

  # Marks these inputs as green, so the next run of the same content skips.
  record:
    name: Record the green inputs
    needs: [changes, build-test, e2e]
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: touch .ci-marker

      - uses: actions/cache/save@v6
        with:
          path: .ci-marker
          key: verified-${{ needs.changes.outputs.inputs }}

  deploy:
    name: Deploy to GitHub Pages
    needs: [changes, build-test, e2e]
    runs-on: ubuntu-24.04
    # Only ever publish the default branch, which the changes job decides.
    # Pull requests run the full test suite above but must never reach
    # production. The E2E jobs are skipped when these inputs passed before.
    if: >-
      !cancelled() && needs.changes.outputs.deploy == 'true'
      && needs.build-test.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.e2e.result)
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - run: touch .ci-marker

      - name: Record the deployed app
        uses: actions/cache/save@v6
        with:
          path: .ci-marker
          key: deployed-${{ needs.changes.outputs.app }}
