# TEMPORARY experiment (docs/TODO.md: WebKit browser close hangs). Removed once done.
name: WebKit close repro

on:
  push:
    branches: [claude/injectable-clock-3442ln]

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.device }} ${{ matrix.shard }}/4 pw${{ matrix.playwright }} #${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: [iphone12, ipadpro]
        shard: [1, 2, 3, 4]
        playwright: ["1.58.0", "1.65.1"]
        repeat: [1, 2]
    env:
      DEVICE: ${{ matrix.device }}
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm install --no-save @playwright/test@${{ matrix.playwright }}
      - run: npx playwright install --with-deps webkit
      - name: Run shard
        shell: bash
        run: npm run test:e2e:prod 2>&1 | tee e2e.log
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
      - name: Close summary (fails on a slow or force-killed close)
        if: always()
        run: |
          grep -hE "\[DIAG\]|gracefully close|<kill>|will force kill|process did exit" e2e.log || true
          ms=$(grep -oP 'close took \K[0-9]+' e2e.log || echo 999999)
          echo "::notice::browser.close took ${ms}ms"
          if grep -q "<kill>" e2e.log || [ "$ms" -gt 5000 ]; then echo "::error::slow or force-killed close (${ms}ms)"; exit 1; fi
